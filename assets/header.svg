<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Bernardo Subtil. Tecnologia na Aurora: automação de processos, IA e sistemas sob medida.">
<defs>
  <linearGradient id="h-faixa" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#51f0d8"/><stop offset=".5" stop-color="#38c6f4"/><stop offset="1" stop-color="#ff2e63"/>
  </linearGradient>
  <filter id="h-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <linearGradient id="h-sombra" x1="0" x2="1"><stop offset=".25" stop-color="#0a0a0a"/><stop offset=".75" stop-color="#0a0a0a" stop-opacity="0"/></linearGradient>
  <clipPath id="h-clip"><rect width="1280" height="420" rx="2"/></clipPath>
</defs>
<style>
  .b{animation:deriva 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .b2{animation-duration:18s;animation-delay:-6s}.b3{animation-duration:22s;animation-delay:-11s}
  @keyframes deriva{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,30px) scale(1.15)}100%{transform:translate(40px,-25px) scale(.9)}}
  .t{animation:sobe .9s cubic-bezier(.2,.7,.2,1) backwards}
  .t1{animation-delay:.1s}.t2{animation-delay:.25s}.t3{animation-delay:.45s}.t4{animation-delay:.6s}.t5{animation-delay:.8s}
  @keyframes sobe{from{opacity:0;transform:translateY(12px)}}
  .cursor{animation:pisca 1.1s steps(1) infinite}
  @keyframes pisca{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.b,.cursor{animation:none}.t{animation:none}}
</style>
